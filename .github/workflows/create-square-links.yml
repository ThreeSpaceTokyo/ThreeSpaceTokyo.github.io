name: Create Square links for new sessions

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually create items and links in Square (unticked = dry run, only prints)"
        type: boolean
        default: false
      price:
        description: "Price per seat in JPY"
        default: "20000"

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-api-python-client google-auth
      - name: Create links
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL || 'https://docs.google.com/spreadsheets/d/1GL8YShTbRhtw0zPxlOqpVSOy6kohseQddiPT-Yw2cx0/gviz/tq?tqx=out:csv&gid=1775567458' }}
        run: |
          python3 scripts/create_square_links.py "$SHEET_CSV_URL" ${{ inputs.apply && '--apply' || '' }} --price "${{ inputs.price }}"
      - name: Commit new links and refresh the session list
        if: ${{ inputs.apply }}
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL || 'https://docs.google.com/spreadsheets/d/1GL8YShTbRhtw0zPxlOqpVSOy6kohseQddiPT-Yw2cx0/gviz/tq?tqx=out:csv&gid=1775567458' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_sessions.py "$SHEET_CSV_URL"
          if git diff --quiet; then echo "No change."; exit 0; fi
          git config user.name "mendtokyo-sync[bot]"
          git config user.email "threespacetokyo@gmail.com"
          git add _data/mending_square_links.json _data/mending_sessions.yml
          git commit -m "Mendtokyo: Square links created for new sessions"
          git push
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
